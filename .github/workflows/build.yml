name: Build Mael AI APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:   # bisa trigger manual dari GitHub

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout kode
        uses: actions/checkout@v3

      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies sistem
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip openjdk-17-jdk \
            autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev \
            libncursesw5-dev libtinfo5 \
            cmake libffi-dev libssl-dev \
            build-essential

      - name: Install Buildozer & Cython
        run: |
          pip install --upgrade pip
          pip install buildozer cython

      - name: Cache .buildozer (biar build berikutnya cepat)
        uses: actions/cache@v3
        with:
          path: .buildozer
          key: buildozer-${{ hashFiles('buildozer.spec') }}
          restore-keys: buildozer-

      - name: Build APK
        run: |
          buildozer android debug 2>&1 | tee build.log

      - name: Upload APK ke Artifacts
        uses: actions/upload-artifact@v3
        with:
          name: MaelAI-APK
          path: bin/*.apk
          retention-days: 7

      - name: Upload log jika gagal
        if: failure()
        uses: actions/upload-artifact@v3
        with:
          name: build-log
          path: build.log