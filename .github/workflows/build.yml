name: Build Mael AI APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies sistem
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip \
            openjdk-17-jdk \
            autoconf libtool pkg-config \
            zlib1g-dev libncurses5-dev \
            libncursesw5-dev \
            cmake libffi-dev libssl-dev \
            build-essential \
            python3-pip

      - name: Install Buildozer & Cython
        run: |
          pip install --upgrade pip setuptools wheel
          pip install buildozer cython virtualenv

      - name: Cache .buildozer
        uses: actions/cache@v4
        with:
          path: .buildozer
          key: buildozer-${{ hashFiles('buildozer.spec') }}
          restore-keys: buildozer-

      - name: Accept Android SDK licenses
        run: |
          mkdir -p $HOME/.buildozer/android/platform
          yes | buildozer android debug --version || true

      - name: Build APK
        run: |
          set -o pipefail
          buildozer -v android debug 2>&1 | tee build.log
          echo "BUILD_EXIT=$?" >> $GITHUB_ENV

      - name: Cek hasil build
        run: |
          echo "=== Isi folder bin/ ==="
          ls -la bin/ || echo "Folder bin/ tidak ada!"
          echo "=== 50 baris terakhir log ==="
          tail -50 build.log

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MaelAI-APK
          path: bin/*.apk
          retention-days: 7
          if-no-files-found: warn

      - name: Upload build log (selalu)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 3
